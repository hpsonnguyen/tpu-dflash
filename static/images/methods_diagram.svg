<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="950" height="520" font-family="'Noto Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="ah-b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3b82f6"/></marker>
    <marker id="ah-g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10b981"/></marker>
    <marker id="ah-p" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#8b5cf6"/></marker>
    <marker id="ah-o" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f97316"/></marker>
    <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.07"/></filter>
  </defs>

  <rect width="950" height="520" fill="#fff"/>

  <!-- ===== BOX 1: TARGET MODEL ===== -->
  <rect x="20" y="52" width="280" height="380" rx="14" fill="#f8fafc" stroke="#e2e8f0" filter="url(#sh)"/>
  <rect x="20" y="52" width="280" height="46" rx="14" fill="url(#g-blue)"/>
  <rect x="20" y="84" width="280" height="14" fill="url(#g-blue)"/>
  <text x="160" y="84" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Target Model</text>
  <text x="160" y="120" font-size="14" fill="#64748b" text-anchor="middle" font-weight="600">Qwen3-4B &#183; 36 layers</text>

  <!-- Layer stack — spread rows with 6/8px gaps -->
  <g transform="translate(42,140)">
    <rect x="0" y="0" width="236" height="20" rx="4" fill="#dbeafe" stroke="#bfdbfe"/>
    <text x="118" y="14" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="600">Layer 1 &#8594; aux</text>
    <rect x="0" y="26" width="236" height="16" rx="4" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="118" y="38" font-size="10" fill="#93c5fd" text-anchor="middle">Layers 2&#8211;8</text>

    <rect x="0" y="50" width="236" height="20" rx="4" fill="#dbeafe" stroke="#bfdbfe"/>
    <text x="118" y="64" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="600">Layer 9 &#8594; aux</text>
    <rect x="0" y="76" width="236" height="16" rx="4" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="118" y="88" font-size="10" fill="#93c5fd" text-anchor="middle">Layers 10&#8211;16</text>

    <rect x="0" y="100" width="236" height="20" rx="4" fill="#dbeafe" stroke="#bfdbfe"/>
    <text x="118" y="114" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="600">Layer 17 &#8594; aux</text>
    <rect x="0" y="126" width="236" height="16" rx="4" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="118" y="138" font-size="10" fill="#93c5fd" text-anchor="middle">Layers 18&#8211;24</text>

    <rect x="0" y="150" width="236" height="20" rx="4" fill="#dbeafe" stroke="#bfdbfe"/>
    <text x="118" y="164" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="600">Layer 25 &#8594; aux</text>
    <rect x="0" y="176" width="236" height="16" rx="4" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="118" y="188" font-size="10" fill="#93c5fd" text-anchor="middle">Layers 26&#8211;32</text>

    <rect x="0" y="200" width="236" height="20" rx="4" fill="#dbeafe" stroke="#bfdbfe"/>
    <text x="118" y="214" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="600">Layer 33 &#8594; aux</text>
    <rect x="0" y="226" width="236" height="16" rx="4" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="118" y="238" font-size="10" fill="#93c5fd" text-anchor="middle">Layers 34&#8211;36</text>
  </g>

  <text x="160" y="406" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="700">Paged KV Cache</text>
  <text x="160" y="422" font-size="11" fill="#94a3b8" text-anchor="middle">(vLLM PagedAttention)</text>

  <!-- ===== ARROW: Target &#8594; combine_fn ===== -->
  <line x1="300" y1="245" x2="356" y2="245" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ah-b)"/>
  <text x="328" y="186" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="600" transform="rotate(-90,328,186)">aux hidden states</text>

  <!-- combine_fn box -->
  <rect x="356" y="217" width="100" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="406" y="241" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">combine_fn</text>
  <text x="406" y="259" font-size="11" fill="#64748b" text-anchor="middle">FC + RMSNorm</text>

  <!-- Arrow: combine_fn &#8594; Draft -->
  <line x1="456" y1="245" x2="508" y2="245" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ah-b)"/>

  <!-- ===== BOX 2: DRAFT MODEL ===== -->
  <rect x="508" y="52" width="230" height="380" rx="14" fill="#f0fdf4" stroke="#bbf7d0" filter="url(#sh)"/>
  <rect x="508" y="52" width="230" height="46" rx="14" fill="url(#g-green)"/>
  <rect x="508" y="84" width="230" height="14" fill="url(#g-green)"/>
  <text x="623" y="84" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Draft Model</text>
  <text x="623" y="120" font-size="14" fill="#64748b" text-anchor="middle" font-weight="600">DFlash &#183; 5 layers &#183; ~429M</text>

  <!-- Input block — pushed down with more breathing room -->
  <text x="623" y="156" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Input Block (K=16)</text>
  <g transform="translate(524,166)">
    <rect x="0" y="0" width="32" height="24" rx="4" fill="#10b981" stroke="#059669"/>
    <text x="16" y="17" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="700">next</text>
    <rect x="36" y="0" width="22" height="24" rx="4" fill="#d1fae5" stroke="#a7f3d0"/>
    <text x="47" y="16" font-size="9" fill="#059669" text-anchor="middle">M</text>
    <rect x="62" y="0" width="22" height="24" rx="4" fill="#d1fae5" stroke="#a7f3d0"/>
    <text x="73" y="16" font-size="9" fill="#059669" text-anchor="middle">M</text>
    <rect x="88" y="0" width="22" height="24" rx="4" fill="#d1fae5" stroke="#a7f3d0"/>
    <text x="99" y="16" font-size="9" fill="#059669" text-anchor="middle">M</text>
    <text x="122" y="16" font-size="12" fill="#94a3b8" text-anchor="middle">&#8230;</text>
    <rect x="136" y="0" width="22" height="24" rx="4" fill="#d1fae5" stroke="#a7f3d0"/>
    <text x="147" y="16" font-size="9" fill="#059669" text-anchor="middle">M</text>
    <rect x="162" y="0" width="32" height="24" rx="4" fill="#d1fae5" stroke="#a7f3d0"/>
    <text x="178" y="16" font-size="9" fill="#059669" text-anchor="middle">M</text>
  </g>

  <!-- Non-causal attention grid — more space above -->
  <text x="623" y="224" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Non-Causal Block Attention</text>
  <g transform="translate(564,250)">
    <rect x="0" y="0" width="118" height="100" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <g font-size="9" fill="#64748b" text-anchor="middle">
      <text x="22" y="-5">Q</text><text x="40" y="-5">1</text><text x="56" y="-5">2</text><text x="72" y="-5">&#8230;</text><text x="88" y="-5">15</text><text x="104" y="-5">16</text>
      <text x="8" y="20">1</text><text x="8" y="38">2</text><text x="8" y="56">3</text><text x="8" y="74">&#8230;</text><text x="8" y="92">K</text>
    </g>
    <g fill="#34d399" opacity="0.5">
      <rect x="18" y="10" width="14" height="14" rx="2"/><rect x="34" y="10" width="14" height="14" rx="2"/><rect x="50" y="10" width="14" height="14" rx="2"/><rect x="66" y="10" width="14" height="14" rx="2"/><rect x="82" y="10" width="14" height="14" rx="2"/><rect x="98" y="10" width="14" height="14" rx="2"/>
      <rect x="18" y="28" width="14" height="14" rx="2"/><rect x="34" y="28" width="14" height="14" rx="2"/><rect x="50" y="28" width="14" height="14" rx="2"/><rect x="66" y="28" width="14" height="14" rx="2"/><rect x="82" y="28" width="14" height="14" rx="2"/><rect x="98" y="28" width="14" height="14" rx="2"/>
      <rect x="18" y="46" width="14" height="14" rx="2"/><rect x="34" y="46" width="14" height="14" rx="2"/><rect x="50" y="46" width="14" height="14" rx="2"/><rect x="66" y="46" width="14" height="14" rx="2"/><rect x="82" y="46" width="14" height="14" rx="2"/><rect x="98" y="46" width="14" height="14" rx="2"/>
      <rect x="18" y="64" width="14" height="14" rx="2"/><rect x="34" y="64" width="14" height="14" rx="2"/><rect x="50" y="64" width="14" height="14" rx="2"/><rect x="66" y="64" width="14" height="14" rx="2"/><rect x="82" y="64" width="14" height="14" rx="2"/><rect x="98" y="64" width="14" height="14" rx="2"/>
      <rect x="18" y="82" width="14" height="14" rx="2"/><rect x="34" y="82" width="14" height="14" rx="2"/><rect x="50" y="82" width="14" height="14" rx="2"/><rect x="66" y="82" width="14" height="14" rx="2"/><rect x="82" y="82" width="14" height="14" rx="2"/><rect x="98" y="82" width="14" height="14" rx="2"/>
    </g>
    <text x="59" y="115" font-size="10" fill="#059669" text-anchor="middle" font-weight="600">All positions attend to all</text>
  </g>

  <text x="623" y="406" font-size="13" fill="#10b981" text-anchor="middle" font-weight="700">Static JAX KV Cache</text>
  <text x="623" y="422" font-size="11" fill="#94a3b8" text-anchor="middle">(dynamic_update_slice)</text>

  <!-- ===== ARROW: Draft &#8594; Verify ===== -->
  <line x1="738" y1="245" x2="772" y2="245" stroke="#10b981" stroke-width="2.5" marker-end="url(#ah-g)"/>
  <text x="755" y="186" font-size="10" fill="#10b981" text-anchor="middle" font-weight="600" transform="rotate(-90,755,186)">K draft tokens</text>

  <!-- ===== BOX 3: VERIFY & ACCEPT ===== -->
  <rect x="772" y="52" width="168" height="380" rx="14" fill="#faf5ff" stroke="#e9d5ff" filter="url(#sh)"/>
  <rect x="772" y="52" width="168" height="46" rx="14" fill="url(#g-purple)"/>
  <rect x="772" y="84" width="168" height="14" fill="url(#g-purple)"/>
  <text x="856" y="84" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Verify</text>

  <!-- 4 sub-boxes spread evenly through the box -->
  <g transform="translate(788,116)">
    <rect x="0" y="0" width="136" height="46" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="68" y="20" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">Target Forward</text>
    <text x="68" y="37" font-size="10.5" fill="#a78bfa" text-anchor="middle">(batched, K tokens)</text>
  </g>

  <line x1="856" y1="164" x2="856" y2="188" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#ah-p)"/>

  <g transform="translate(788,190)">
    <rect x="0" y="0" width="136" height="46" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="68" y="20" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">Shared LM Head</text>
    <text x="68" y="37" font-size="10.5" fill="#a78bfa" text-anchor="middle">logits &#8594; argmax</text>
  </g>

  <line x1="856" y1="238" x2="856" y2="262" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#ah-p)"/>

  <g transform="translate(788,264)">
    <rect x="0" y="0" width="136" height="46" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="68" y="20" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">Rejection Sampling</text>
    <text x="68" y="37" font-size="10.5" fill="#a78bfa" text-anchor="middle">draft[i+1] == post[i]</text>
  </g>

  <line x1="856" y1="312" x2="856" y2="336" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#ah-p)"/>

  <g transform="translate(788,338)">
    <rect x="0" y="0" width="136" height="46" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="68" y="20" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">Accept Prefix</text>
    <text x="68" y="37" font-size="10.5" fill="#a78bfa" text-anchor="middle">keep longest match</text>
  </g>

  <text x="856" y="410" font-size="13" fill="#8b5cf6" text-anchor="middle" font-weight="700">Output Tokens</text>

  <!-- ===== FEEDBACK LOOP ===== -->
  <path d="M 856,432 L 856,464 Q 856,484 836,484 L 180,484 Q 160,484 160,464 L 160,432" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#ah-o)"/>

  <rect x="400" y="472" width="200" height="28" rx="7" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="500" y="491" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">Accepted tokens &#8594; repeat</text>


  <!-- ===== O(1) BADGE ===== -->
  <rect x="562" y="20" width="122" height="28" rx="14" fill="#10b981"/>
  <text x="623" y="40" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">O(1) draft cost</text>

</svg>
