<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="40" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    DFlash GPU &#8594; TPU Migration
  </text>

  <rect x="40" y="70" width="360" height="180" rx="12" fill="#f1f5f9" stroke="#cbd5f5"/>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    GPU (PyTorch)
  </text>
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="13" fill="#334155">
    &#8226; Draft model: diffusion block (b16)
  </text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="13" fill="#334155">
    &#8226; Target verification in PyTorch
  </text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="13" fill="#334155">
    &#8226; DynamicCache (concat KV)
  </text>
  <text x="60" y="210" font-family="Arial, sans-serif" font-size="13" fill="#334155">
    &#8226; GPU FlashAttention
  </text>

  <rect x="500" y="70" width="360" height="180" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="520" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    TPU (JAX / tpu-inference)
  </text>
  <text x="520" y="135" font-family="Arial, sans-serif" font-size="13" fill="#334155">
    &#8226; Draft model: diffusion block (b16)
  </text>
  <text x="520" y="160" font-family="Arial, sans-serif" font-size="13" fill="#334155">
    &#8226; Target verification in JAX
  </text>
  <text x="520" y="185" font-family="Arial, sans-serif" font-size="13" fill="#334155">
    &#8226; Dual KV cache (paged + static)
  </text>
  <text x="520" y="210" font-family="Arial, sans-serif" font-size="13" fill="#334155">
    &#8226; TPU flash_attention (non-causal)
  </text>

  <line x1="400" y1="160" x2="500" y2="160" stroke="#64748b" stroke-width="2"/>
  <polygon points="500,160 490,154 490,166" fill="#64748b"/>

  <rect x="40" y="280" width="820" height="200" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    Key Porting Steps
  </text>

  <rect x="60" y="335" width="240" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="78" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">
    Dual KV Cache
  </text>
  <text x="78" y="388" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    Target uses paged KV;
  </text>
  <text x="78" y="408" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    draft uses static JAX KV.
  </text>

  <rect x="330" y="335" width="240" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="348" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">
    Attention Kernel Swap
  </text>
  <text x="348" y="388" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    Use TPU flash_attention
  </text>
  <text x="348" y="408" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    with non-causal block.
  </text>

  <rect x="600" y="335" width="240" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="618" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">
    Seq-len Alignment Fix
  </text>
  <text x="618" y="388" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    Track accepted length
  </text>
  <text x="618" y="408" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    to prevent state drift.
  </text>
</svg>
